[project]
name = "agent-loop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Laksiri Fernando", email = "laksirif@kingslake.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "jinja2==3.1.6",
    "langchain==1.3.14",
    "langchain-groq==1.1.3",
    "langgraph==1.2.10",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
agent-loop = "agent_loop:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
